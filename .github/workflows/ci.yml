name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install --yes iverilog
      - name: Run simulations and FPGA syntax check
        run: make test
